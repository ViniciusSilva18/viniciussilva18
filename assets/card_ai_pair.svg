<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 140" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
  </defs>

  <style>
    .label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      font-weight: 500;
      fill: #8b949e;
    }
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 15px;
      font-weight: 700;
      fill: #f0f6fc;
    }
    .lang {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #c9d1d9;
    }
  </style>

  <rect x="2" y="2" width="206" height="136" rx="12" fill="url(#cardBg)" stroke="#30363d" stroke-width="1.5" />

  <g transform="translate(18, 28)">
    <text x="0" y="14" class="label">Project</text>
    <text x="0" y="40" class="title">AI-Pair-Programmer</text>
    
    <!-- Language: JS -->
    <g transform="translate(0, 64)">
      <!-- JS Yellow Box Icon -->
      <rect x="0" y="1" width="15" height="15" rx="2" fill="#F7DF1E"/>
      <text x="3" y="12" font-family="sans-serif" font-size="9" font-weight="900" fill="#000000">JS</text>
      <text x="22" y="13" class="lang">JavaScript</text>
    </g>
  </g>

  <!-- Watermark -->
  <g transform="translate(172, 102) scale(0.55)" opacity="0.35">
    <polygon points="20,2 38,12 38,32 20,42 2,32 2,12" fill="none" stroke="#8b949e" stroke-width="2" />
    <circle cx="20" cy="22" r="6" fill="#8b949e" />
  </g>
</svg>
