<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 140" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
  </defs>

  <style>
    .label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      font-weight: 500;
      fill: #8b949e;
    }
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 15px;
      font-weight: 700;
      fill: #f0f6fc;
    }
    .lang {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #c9d1d9;
    }
  </style>

  <rect x="2" y="2" width="206" height="136" rx="12" fill="url(#cardBg)" stroke="#30363d" stroke-width="1.5" />

  <g transform="translate(18, 28)">
    <text x="0" y="14" class="label">Project</text>
    <text x="0" y="40" class="title">Claude-Assistant-V1</text>
    
    <!-- Language: TensorFlow -->
    <g transform="translate(0, 64)">
      <!-- TensorFlow Flame / Hex Icon -->
      <g transform="scale(0.85)">
        <polygon points="8,0 16,4.5 16,13.5 8,18 0,13.5 0,4.5" fill="#FF6F00"/>
        <polygon points="8,4 12,6.5 12,11.5 8,14 4,11.5 4,6.5" fill="#FFA000"/>
      </g>
      <text x="22" y="13" class="lang">TensorFlow / AI</text>
    </g>
  </g>

  <!-- Watermark -->
  <g transform="translate(172, 102) scale(0.55)" opacity="0.35">
    <polygon points="20,2 38,12 38,32 20,42 2,32 2,12" fill="none" stroke="#8b949e" stroke-width="2" />
    <circle cx="20" cy="22" r="6" fill="#8b949e" />
  </g>
</svg>
