<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>

    <!-- Neon Button Gradient -->
    <linearGradient id="neonBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38ef7d" stop-opacity="0.8" />
      <stop offset="35%" stop-color="#11998e" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#8a2be2" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00d2ff" stop-opacity="0.8" />
    </linearGradient>

    <!-- Ambient Glow -->
    <radialGradient id="glowLeft" cx="15%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#00d2ff" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowRight" cx="85%" cy="70%" r="40%">
      <stop offset="0%" stop-color="#8a2be2" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#8a2be2" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="btnBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f242c" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#12161c" stop-opacity="0.95" />
    </linearGradient>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 24px;
      font-weight: 700;
      fill: #f0f6fc;
      letter-spacing: -0.3px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 14px;
      font-weight: 400;
      fill: #8b949e;
      letter-spacing: 0.2px;
    }
    .btn-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 16px;
      font-weight: 800;
      fill: #ffffff;
      letter-spacing: 2.5px;
    }
    .edit-icon {
      fill: #484f58;
      transition: fill 0.2s;
    }
  </style>

  <!-- Card Outer Frame -->
  <rect x="2" y="2" width="896" height="236" rx="16" fill="url(#bgGrad)" stroke="#30363d" stroke-width="1.5" />

  <!-- Ambient Lighting Glows -->
  <rect x="2" y="2" width="896" height="236" rx="16" fill="url(#glowLeft)" />
  <rect x="2" y="2" width="896" height="236" rx="16" fill="url(#glowRight)" />

  <!-- Title Text -->
  <text x="35" y="52" class="title">Olá eu sou o Vinicius, estou aprendendo a programar!</text>

  <!-- Subtitle Text -->
  <text x="35" y="82" class="subtitle">Bem-vindo ao meu laboratório de inovação, códigos e projetos no GitHub ⚡</text>

  <!-- Pencil / Edit Icon in top right -->
  <g transform="translate(855, 36) scale(0.9)">
    <path class="edit-icon" d="M11.013 1.427a1.75 1.75 0 0 1 2.474 0l1.086 1.086a1.75 1.75 0 0 1 0 2.474l-8.61 8.61c-.21.21-.47.364-.756.445l-3.251.93a.75.75 0 0 1-.927-.928l.929-3.25c.081-.286.235-.547.445-.758l8.61-8.61Zm1.414 1.06a.25.25 0 0 0-.354 0L10.811 3.75l1.439 1.44 1.263-1.263a.25.25 0 0 0 0-.354l-1.086-1.086ZM11.189 6.25 9.75 4.81 3.25 11.31l-.547 1.913 1.913-.547L11.189 6.25Z" />
  </g>

  <!-- CLAUDE PROJECT INCUBATOR Center Banner / Button -->
  <g transform="translate(35, 120)">
    <!-- Button Glow Shadow -->
    <rect x="0" y="0" width="830" height="74" rx="14" fill="#000000" opacity="0.4" />
    <!-- Outer Glow Border -->
    <rect x="0" y="0" width="830" height="74" rx="14" fill="url(#btnBg)" stroke="url(#neonBorder)" stroke-width="1.8" />
    
    <!-- Left Accent Light -->
    <circle cx="25" cy="37" r="4" fill="#38ef7d">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="25" cy="37" r="8" fill="#38ef7d" opacity="0.25">
      <animate attributeName="r" values="6;12;6" dur="2s" repeatCount="indefinite" />
    </circle>

    <!-- Right Accent Light -->
    <circle cx="805" cy="37" r="4" fill="#00d2ff">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="805" cy="37" r="8" fill="#00d2ff" opacity="0.25">
      <animate attributeName="r" values="12;6;12" dur="2s" repeatCount="indefinite" />
    </circle>

    <!-- Center Text -->
    <text x="415" y="44" text-anchor="middle" class="btn-text">CLAUDE PROJECT INCUBATOR</text>
  </g>
</svg>
